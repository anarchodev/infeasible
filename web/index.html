<!doctype html>
<meta charset="utf-8">
<title>infeasible — the cellar</title>
<!-- inline, because §12's first rot rule is that nothing is fetched at
     runtime — and because a missing favicon is a 404 in every console -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230b0d10'/%3E%3Crect x='2' y='1' width='4' height='6' fill='%238a5a2b'/%3E%3Crect x='4' y='4' width='1' height='1' fill='%23e8c37a'/%3E%3C/svg%3E">
<!--
  The playable cellar in a browser (DESIGN.md §11 M2): the WASM engine, the
  .story world, the generated typed binding, the frozen presentation interface
  and one cart — with no build step and nothing fetched from anywhere but this
  directory (§12's first rot rule).

  Serve the REPO ROOT and open /web/ :

      python3 -m http.server 8000     # from the repo root
      xdg-open http://localhost:8000/web/

  The root rather than web/, because the page fetches the .story SOURCE. That
  is deliberate and it is the whole content model: source is always shipped,
  and the compiled form is a cache, never the artifact (§12).

  Everything below the <script> is chrome — mortal, above the durability line,
  and replaceable without touching a cart.
-->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #6b7f99;
               font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  /* Chrome around the canvas costs INTEGER SCALE, not just room: 46px of
     caption is the difference between ×2 and ×1 at 720p. What the player needs
     to know is in the game's own title bar, at the game's own resolution. */
  body { display: flex; flex-direction: column; padding: 4px; box-sizing: border-box; }
  /* The canvas fills what is left and the ENGINE letterboxes inside it (§12).
     Constraining the element's aspect ratio too would letterbox twice, and the
     second one only costs integer scale: at 921px the upscale is ×2, at 960 it
     is ×3. Give the surface everything and let the frozen rule do its job. */
  canvas { flex: 1 1 auto; width: 100%; min-height: 0; display: block;
           image-rendering: pixelated; background: #000; touch-action: none; }
  p { margin: 0; text-align: center; }
  p:empty { display: none; }
  /* Fullscreen is where the arithmetic pays off: with no chrome in the way a
     1920x1080 display is a whole-number multiple of every blessed internal
     resolution, so the picture fills the screen with no letterbox bars at all.
     The control is `fixed`, so it costs the canvas no height when unused. */
  #full { position: fixed; right: 6px; bottom: 6px; z-index: 1;
          font: inherit; color: #6b7f99; background: #1d2433; border: 1px solid #3b4b63;
          padding: 2px 8px; cursor: pointer; opacity: .45; }
  #full:hover { opacity: 1; color: #f2f0e6; }
  :root:fullscreen body { padding: 0; }
  a { color: #79b8e8; }
  #err { color: #e06666; white-space: pre-wrap; font-size: 11px; max-width: 90vw; }
</style>

<canvas id="screen" width="960" height="540"></canvas>
<button id="full" title="fullscreen (esc to leave)">&#x26F6;</button>
<p id="err"></p>

<script src="./infeasible.js"></script>
<script type="module">
import { createCanvasBackend } from './platform/canvas2d.mjs';
import { createPlatform } from './platform/platform.mjs';
import { createRuntime } from './platform/runtime.mjs';
import { cart, open, STORY } from './carts/cellar.mjs';

try {
  const M = await createInfeasible();
  const src = await (await fetch('../' + STORY)).text();
  const world = open(M, src);          // throws if the binding is stale (§6.3)

  const canvas = document.getElementById('screen');
  const backend = createCanvasBackend(canvas, { resolution: cart.resolution });
  backend.attach();                    // the ONLY place DOM events are touched

  // Fullscreen needs a user gesture, so the PAGE owns the control and the
  // backend owns the call. Nothing here is reachable from the cart.
  const full = document.getElementById('full');
  full.addEventListener('click', () => backend.fullscreen());
  document.addEventListener('fullscreenchange',
    () => { full.textContent = backend.isFullscreen() ? '\u2715' : '\u26F6'; });

  const platform = createPlatform(backend);
  createRuntime({ platform, backend, cart, world }).start();
} catch (e) {
  document.getElementById('err').textContent = e.message;
  throw e;
}
</script>
